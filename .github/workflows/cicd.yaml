name: RAG Sentinel CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rag-sentinel-deployment
  cancel-in-progress: false

jobs:
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q app worker services scripts app.py

      - name: Build Docker image
        run: docker build --tag rag-sentinel:${{ github.sha }} .

  build-and-push-ecr:
    name: Build and push backend image
    needs: integration
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$ECR_REGISTRY"
          test -n "$ECR_REPOSITORY"
          image="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --tag "$image" .
          docker push "$image"

  deploy:
    name: Deploy FastAPI backend
    needs: build-and-push-ecr
    runs-on: [self-hosted, linux, x64, rag-sentinel-ec2]
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construct image URI
        id: image
        env:
          AWS_REGION: eu-north-1
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          image="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Validate application secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-north-1
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_EMBED_MODEL: ${{ secrets.GOOGLE_EMBED_MODEL }}
          EMBED_DIM: ${{ secrets.EMBED_DIM }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          PINECONE_CLOUD: ${{ secrets.PINECONE_CLOUD }}
          PINECONE_REGION: ${{ secrets.PINECONE_REGION }}
          PINECONE_READY_TIMEOUT: ${{ secrets.PINECONE_READY_TIMEOUT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RIUS_API_KEY: ${{ secrets.RIUS_API_KEY }}
          RIUS_SERVICE_NAME: ${{ secrets.RIUS_SERVICE_NAME }}
          RIUS_DISABLED: ${{ secrets.RIUS_DISABLED }}
          RIUS_CAPTURE_CONTENT: ${{ secrets.RIUS_CAPTURE_CONTENT }}
          HITL_ENABLED: ${{ secrets.HITL_ENABLED }}
          MEMORY_TURNS: ${{ secrets.MEMORY_TURNS }}
        run: |
          set -euo pipefail
          required=(
            AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION S3_BUCKET_NAME
            OPENROUTER_API_KEY OPENROUTER_MODEL GOOGLE_API_KEY GOOGLE_EMBED_MODEL EMBED_DIM
            PINECONE_API_KEY PINECONE_INDEX_NAME PINECONE_CLOUD PINECONE_REGION
            PINECONE_READY_TIMEOUT DATABASE_URL RIUS_API_KEY RIUS_SERVICE_NAME
            RIUS_DISABLED RIUS_CAPTURE_CONTENT HITL_ENABLED MEMORY_TURNS
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing application secret: $name"
              exit 1
            fi
          done

      - name: Pull image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: docker pull "$IMAGE"

      - name: Replace running backend container
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-north-1
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_EMBED_MODEL: ${{ secrets.GOOGLE_EMBED_MODEL }}
          EMBED_DIM: ${{ secrets.EMBED_DIM }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          PINECONE_CLOUD: ${{ secrets.PINECONE_CLOUD }}
          PINECONE_REGION: ${{ secrets.PINECONE_REGION }}
          PINECONE_READY_TIMEOUT: ${{ secrets.PINECONE_READY_TIMEOUT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RIUS_API_KEY: ${{ secrets.RIUS_API_KEY }}
          RIUS_SERVICE_NAME: ${{ secrets.RIUS_SERVICE_NAME }}
          RIUS_DISABLED: ${{ secrets.RIUS_DISABLED }}
          RIUS_CAPTURE_CONTENT: ${{ secrets.RIUS_CAPTURE_CONTENT }}
          HITL_ENABLED: ${{ secrets.HITL_ENABLED }}
          MEMORY_TURNS: ${{ secrets.MEMORY_TURNS }}
        run: |
          set -euo pipefail
          docker rm -f rag-sentinel-api 2>/dev/null || true
          docker run -d \
            --name rag-sentinel-api \
            --restart unless-stopped \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_REGION \
            -e S3_BUCKET_NAME \
            -e OPENROUTER_API_KEY \
            -e OPENROUTER_MODEL \
            -e GOOGLE_API_KEY \
            -e GOOGLE_EMBED_MODEL \
            -e EMBED_DIM \
            -e PINECONE_API_KEY \
            -e PINECONE_INDEX_NAME \
            -e PINECONE_CLOUD \
            -e PINECONE_REGION \
            -e PINECONE_READY_TIMEOUT \
            -e DATABASE_URL \
            -e RIUS_API_KEY \
            -e RIUS_SERVICE_NAME \
            -e RIUS_DISABLED \
            -e RIUS_CAPTURE_CONTENT \
            -e HITL_ENABLED \
            -e MEMORY_TURNS \
            -p 8000:8000 \
            "$IMAGE"

      - name: Verify deployment
        run: |
          set -euo pipefail
          if ! docker inspect -f '{{.State.Running}}' rag-sentinel-api | grep -qx true; then
            docker logs --tail 100 rag-sentinel-api
            exit 1
          fi
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            http://127.0.0.1:8000/health/live > /dev/null

      - name: Clean unused Docker images
        run: docker image prune -f
